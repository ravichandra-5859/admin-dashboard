<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <h2 class="logo">AdminPro</h2>

        <ul>
          <li class="active">
            <i class="fa-solid fa-house"></i>
            Dashboard
          </li>

          <li>
            <i class="fa-solid fa-chart-line"></i>
            Analytics
          </li>

          <li>
            <i class="fa-solid fa-users"></i>
            Users
          </li>

          <li>
            <i class="fa-solid fa-folder"></i>
            Projects
          </li>

          <li>
            <i class="fa-solid fa-gear"></i>
            Settings
          </li>
        </ul>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        <h1>Welcome Ravi 👋</h1>
        <div class="cards">

  <div class="card">
    <i class="fa-solid fa-users"></i>
    <h3>Total Users</h3>
    <h2>12,845</h2>
  </div>

  <div class="card">
    <i class="fa-solid fa-dollar-sign"></i>
    <h3>Revenue</h3>
    <h2>$28,947</h2>
  </div>

  <div class="card">
    <i class="fa-solid fa-folder"></i>
    <h3>Projects</h3>
    <h2>1,274</h2>
  </div>

  <div class="card">
    <i class="fa-solid fa-list-check"></i>
    <h3>Tasks</h3>
    <h2>8,562</h2>
  </div>

</div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
